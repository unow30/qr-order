services:
  server:
    image: ${ECR_REGISTRY}/qr-order-server:latest
    container_name: qr-order-server
    environment:
      DATABASE_SSL: 'true'
      CORS_ORIGINS: https://www.qr-order-demo.it.kr,https://admin.qr-order-demo.it.kr
      PM2_INSTANCES: '1'
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - server-network

  nginx:
    image: nginx:alpine
    container_name: qr-order-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - server-network

networks:
  server-network:
    driver: bridge
