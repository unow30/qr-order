services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: qr-order-web
    restart: unless-stopped
    networks:
      - frontend-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: qr-order-admin
    restart: unless-stopped
    networks:
      - frontend-network

  nginx:
    image: nginx:alpine
    container_name: qr-order-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - admin
    restart: unless-stopped
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
