services:
  web:
    image: ${ECR_REGISTRY}/qr-order-web:latest
    container_name: qr-order-web
    restart: unless-stopped
    networks:
      - frontend-network

  admin:
    image: ${ECR_REGISTRY}/qr-order-admin:latest
    container_name: qr-order-admin
    env_file:
      - ./apps/admin/.env.production
    restart: unless-stopped
    networks:
      - frontend-network

  nginx:
    image: nginx:alpine
    container_name: qr-order-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - admin
    restart: unless-stopped
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
