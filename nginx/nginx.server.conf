upstream api_backend { server server:3000; }

server {
    listen 80;
    server_name server.qr-order-demo.it.kr;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health-check {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    error_page 502 503 504 @server_fallback;

    location @server_fallback {
        default_type text/html;
        return 502 '<html><body><h1>nginx-server</h1><p>API server is not available.</p></body></html>';
    }

    location / {
        proxy_pass         http://api_backend;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header   Connection '';
        chunked_transfer_encoding on;
    }
}

# 기본 (매칭 안 되는 Host) → 444
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
