upstream web_frontend   { server web:80; }
upstream admin_frontend { server admin:80; }

# bare domain → www 리다이렉트
server {
    listen 80;
    server_name qr-order-demo.it.kr;
    return 301 https://www.qr-order-demo.it.kr$request_uri;
}

server {
    listen 80;
    server_name www.qr-order-demo.it.kr;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health-check {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    error_page 502 503 504 @web_fallback;

    location @web_fallback {
        default_type text/html;
        return 502 '<html><body><h1>nginx-web</h1><p>Web frontend is not available.</p></body></html>';
    }

    location / {
        proxy_pass http://web_frontend;
    }
}

server {
    listen 80;
    server_name admin.qr-order-demo.it.kr;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health-check {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    error_page 502 503 504 @admin_fallback;

    location @admin_fallback {
        default_type text/html;
        return 502 '<html><body><h1>nginx-admin</h1><p>Admin frontend is not available.</p></body></html>';
    }

    location / {
        proxy_pass http://admin_frontend;
    }
}