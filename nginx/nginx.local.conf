upstream web_frontend   { server web:80; }
upstream admin_frontend { server admin:80; }
upstream api_backend   { server server:3000; }

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    error_page 502 503 504 @fallback;

    location @fallback {
        default_type text/html;
        return 502 '<html><body><h1>Service Unavailable</h1></body></html>';
    }

    # API 프록시 (SSE 포함)
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header   Connection '';
        chunked_transfer_encoding on;

        error_page 502 503 504 @api_fallback;
    }

    location @api_fallback {
        default_type text/html;
        return 502 '<html><body><h1>nginx-server</h1><p>API server is not available.</p></body></html>';
    }

    # 어드민 SPA (/admin → admin 컨테이너 /, prefix 제거)
    location /admin/ {
        proxy_pass http://admin_frontend/;

        error_page 502 503 504 @admin_fallback;
    }
    location = /admin {
        return 301 /admin/;
    }

    location @admin_fallback {
        default_type text/html;
        return 502 '<html><body><h1>nginx-admin</h1><p>Admin frontend is not available.</p></body></html>';
    }

    # 고객 Web SPA
    location / {
        proxy_pass http://web_frontend;

        error_page 502 503 504 @web_fallback;
    }

    location @web_fallback {
        default_type text/html;
        return 502 '<html><body><h1>nginx-web</h1><p>Web frontend is not available.</p></body></html>';
    }
}
