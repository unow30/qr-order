upstream web_frontend   { server web:80; }
upstream admin_frontend { server admin:80; }
upstream api_backend   { server server:3000; }

map $http_origin $cors_origin {
    default "";
    "https://www.qr-order-demo.it.kr"   $http_origin;
    "https://admin.qr-order-demo.it.kr"  $http_origin;
    "http://localhost:3001"               $http_origin;
    "http://localhost:3002"               $http_origin;
    "http://www.localhost"               $http_origin;
    "http://admin.localhost"               $http_origin;
}

server {
    listen 80;
    server_name www.localhost;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health-check {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    error_page 502 503 504 @web_fallback;

    location @web_fallback {
        default_type text/html;
        return 502 '<html><body><h1>nginx-web</h1><p>Web frontend is not available.</p></body></html>';
    }

    location / {
        proxy_pass http://web_frontend;
    }
}

server {
    listen 80;
    server_name admin.localhost;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health-check {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    error_page 502 503 504 @admin_fallback;

    location @admin_fallback {
        default_type text/html;
        return 502 '<html><body><h1>nginx-admin</h1><p>Admin frontend is not available.</p></body></html>';
    }

    location / {
        proxy_pass http://admin_frontend;
    }
}

server {
    listen 80;
    server_name server.localhost;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health-check {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    error_page 502 503 504 @server_fallback;

    location @server_fallback {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods 'GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type,Authorization,X-Session-Token,X-Store-Id' always;
        add_header Access-Control-Allow-Credentials 'true' always;
        default_type text/html;
        return 502 '<html><body><h1>nginx-server</h1><p>API server is not available.</p></body></html>';
    }

    location / {
        proxy_pass         http://api_backend;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header   Connection '';
        chunked_transfer_encoding on;
    }
}